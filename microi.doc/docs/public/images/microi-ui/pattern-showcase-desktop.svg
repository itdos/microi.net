  <text x="42" y="711" fill="#7385a4" font-family="Arial,Microsoft YaHei,sans-serif" font-size="10">MICROI.UI ORIGINAL ASSET · NO EXTERNAL DEPENDENCY</text>
  <text x="1158" y="711" text-anchor="end" fill="#7385a4" font-family="Arial,Microsoft YaHei,sans-serif" font-size="10">1440 / RESPONSIVE</text>

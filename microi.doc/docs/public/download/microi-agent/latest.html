<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>下载 Microi Agent 最新版</title>
  <meta name="description" content="从吾码官方更新清单获取 Microi Agent 最新 Windows 或 macOS 安装包，并安全跳转到吾码 CDN。">
  <meta name="keywords" content="Microi Agent,吾码,Windows 下载,macOS 下载,最新版">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://microi.net/download/microi-agent/latest.html">
  <meta property="og:title" content="下载 Microi Agent 最新版">
  <meta property="og:description" content="从吾码官方更新清单获取 Microi Agent 最新 Windows 或 macOS 安装包。">
  <meta property="og:url" content="https://microi.net/download/microi-agent/latest.html">
  <meta property="og:image" content="https://microi.net/home2.jpg">
  <style>body{font:16px/1.7 system-ui,sans-serif;margin:0;background:#0d1422;color:#eff4ff;display:grid;min-height:100vh;place-items:center}main{max-width:560px;padding:32px}a{color:#8aaaff}</style>
</head>
<body>
  <main><h1>正在获取 Microi Agent 最新版…</h1><p id="message">从吾码官方更新清单读取安装包地址。</p><p><a href="/doc/v8-engine/microi-agent.html">返回产品文档</a></p></main>
  <script>
    (async () => {
      const mac = new URLSearchParams(location.search).get('platform') === 'mac'
      const channel = mac ? 'latest-mac.yml' : 'latest.yml'
      const message = document.getElementById('message')
      try {
        const response = await fetch('https://api.itdos.com/microi-code/updates/latest/' + channel, { cache: 'no-store' })
        if (!response.ok) throw new Error('HTTP ' + response.status)
        const yaml = await response.text()
        const urls = Array.from(yaml.matchAll(/^\s*-\s*url:\s*(https:\/\/\S+)\s*$/gm), match => match[1])
        const target = urls.find(url => url.endsWith(mac ? '.dmg' : '.exe'))
        if (!target || new URL(target).hostname !== 'static.itdos.com') throw new Error('更新清单中没有可信安装包')
        message.textContent = '正在前往吾码 CDN 下载…'
        location.replace(target)
      } catch (error) {
        message.textContent = '暂时无法读取最新版下载地址：' + String(error.message || error) + '。请稍后重试。'
      }
    })()
  </script>
</body>
</html>

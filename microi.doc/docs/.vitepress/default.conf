# 只有带内容指纹的资源长期缓存；HTML、robots 和 sitemap 随发布重新校验。
map $uri $microi_docs_cache_control {
    default "no-cache";
    "~^/assets/.+\.[A-Za-z0-9_-]{8,}\.(js|css|woff2?)$" "public, max-age=31536000, immutable";
}

# 规范主域与对外推广域名一致，使用不带 www 的 microi.net。
# ESA / 群晖转发规范请求时，回源 Host 应为 microi.net，不能固定改成 www.microi.net。
server {
    listen 0.0.0.0:80;
    server_name www.microi.net doc.microi.net;
    return 301 https://microi.net$request_uri;
}

server {
    listen 0.0.0.0:80 default_server;
    server_name microi.net localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # 源站可以通过 HTTP 回源；相对路径跳转不会把外部 HTTPS 降级或暴露内部端口。
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    add_header Cache-Control $microi_docs_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin '*';

    # 培训大文件由官方 CDN 交付；仅兼容已验签的九个旧地址，未知路径仍返回真实 404。
    location = /downloads/microi-ai-development-framework-training-syllabus-dark.pdf { return 301 https://static.itdos.com/itdos/official-docs/downloads/04feed5a2e28d38aaad87627ce0fdf9e077395caa83728b3d14dc5a406273433/202610/microi-ai-development-framework-training-syllabus-dark.pdf; }
    location = /downloads/microi-ai-development-framework-training-syllabus-dark.pptx { return 301 https://static.itdos.com/itdos/official-docs/downloads/91fca7e19146f0be7feedc24e92f8561923d30ae4abb6e77c33eb10acf1fbca3/202610/microi-ai-development-framework-training-syllabus-dark.pptx; }
    location = /downloads/microi-ai-development-framework-training-syllabus-light.pdf { return 301 https://static.itdos.com/itdos/official-docs/downloads/0dfea7953cd3c6931049fe3c0cb500ab87e7933551443e985572a9b91a88f44b/202610/microi-ai-development-framework-training-syllabus-light.pdf; }
    location = /downloads/microi-ai-development-framework-training-syllabus-light.pptx { return 301 https://static.itdos.com/itdos/official-docs/downloads/1d56cbe0a01c0ff61fd12a018e3f763634250a61cd9561ca672c8b6318786ff0/202610/microi-ai-development-framework-training-syllabus-light.pptx; }
    location = /downloads/microi-ai-development-framework-training-syllabus.pdf { return 301 https://static.itdos.com/itdos/official-docs/downloads/494b6a08a086c41dcf03cf86ee7390459d17981fbfebe45f4c4bf960b07355e5/202610/microi-ai-development-framework-training-syllabus.pdf; }
    location = /downloads/microi-enterprise-application-training-syllabus-dark.pdf { return 301 https://static.itdos.com/itdos/official-docs/downloads/da2c2b7983cfd47a8157fc65b7c8ef8338cfbf46057e64188b1f4d8ee70df7d5/202610/microi-enterprise-application-training-syllabus-dark.pdf; }
    location = /downloads/microi-enterprise-application-training-syllabus-dark.pptx { return 301 https://static.itdos.com/itdos/official-docs/downloads/b5032ea7310acced4958f2def73aa76f35c4fc879d72aeef6df688e1c4f41009/202610/microi-enterprise-application-training-syllabus-dark.pptx; }
    location = /downloads/microi-enterprise-application-training-syllabus-light.pdf { return 301 https://static.itdos.com/itdos/official-docs/downloads/f650bf228698dbf3dcdfad2b291c036932ba4111d7fda8f088d93000f5c6a209/202610/microi-enterprise-application-training-syllabus-light.pdf; }
    location = /downloads/microi-enterprise-application-training-syllabus-light.pptx { return 301 https://static.itdos.com/itdos/official-docs/downloads/287a12d688496c9de17e2430847d5ba99c3c2d6a4908edc6ac9a08f04e3e4ad2/202610/microi-enterprise-application-training-syllabus-light.pptx; }

    # 真正的 HTTP 404 配合官网主题错误页，浏览器和爬虫取得相同的可读内容。
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { return 404; }
    # 直接交付首页，避免 nginx 的 index 内部跳转再次触发 index.html 归一化。
    location = / { try_files /index.html =404; }

    # 仅在对应目录首页存在时归一化 index，query 参数保持不变。
    location ~ ^(?<microi_index_dir>/(?:.*/)?)index(?:\.html)?$ {
        if (-f $document_root${microi_index_dir}index.html) {
            return 301 $microi_index_dir$is_args$args;
        }
        return 404;
    }
    location ~ ^(?<microi_page_path>.+)/$ {
        if (-f $document_root$microi_page_path.html) {
            return 301 $microi_page_path.html$is_args$args;
        }
        try_files $uri $uri/index.html =404;
    }
    location ~* \.(html|js|css|json|xml|txt|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|pdf)$ {
        try_files $uri =404;
    }
    location / {
        if (-f $request_filename.html) {
            return 301 $uri.html$is_args$args;
        }
        try_files $uri $uri/ =404;
    }
}

# 只有带内容指纹的资源长期缓存；HTML、robots 和 sitemap 随发布重新校验。
map $uri $microi_docs_cache_control {
    default "no-cache";
    "~^/assets/.+\.[A-Za-z0-9_-]{8,}\.(js|css|woff2?)$" "public, max-age=31536000, immutable";
}

# 规范主域与对外推广域名一致，使用不带 www 的 microi.net。
# ESA / 群晖转发规范请求时，回源 Host 应为 microi.net，不能固定改成 www.microi.net。
server {
    listen 0.0.0.0:80;
    server_name www.microi.net doc.microi.net;
    return 301 https://microi.net$request_uri;
}

server {
    listen 0.0.0.0:80 default_server;
    server_name microi.net localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # 源站可以通过 HTTP 回源；相对路径跳转不会把外部 HTTPS 降级或暴露内部端口。
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    add_header Cache-Control $microi_docs_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin '*';

    # 培训大文件由官方 CDN 交付；仅兼容已验签的九个旧地址，未知路径仍返回真实 404。
    location = /downloads/microi-ai-development-framework-training-syllabus-dark.pdf { return 301 https://file.microi.net/itdos/official-docs/downloads/6b92bd370be3c549ad6cf62506b330360bcd05746021ca330de72dc9f20ca94a/202610/microi-ai-development-framework-training-syllabus-dark.pdf; }
    location = /downloads/microi-ai-development-framework-training-syllabus-dark.pptx { return 301 https://file.microi.net/itdos/official-docs/downloads/99271bbea9006d78b0f0654ea88630789d7e536d0b13776e3c67445f4532c7f0/202610/microi-ai-development-framework-training-syllabus-dark.pptx; }
    location = /downloads/microi-ai-development-framework-training-syllabus-light.pdf { return 301 https://file.microi.net/itdos/official-docs/downloads/512cd2eb8ac7e2e0e142b35f8ce34d2325ff80369b487021c41d6bf742c44cb7/202610/microi-ai-development-framework-training-syllabus-light.pdf; }
    location = /downloads/microi-ai-development-framework-training-syllabus-light.pptx { return 301 https://file.microi.net/itdos/official-docs/downloads/f44e95319d5ee75702f57aa34ef0ad68c1332d04190160138ce10bd5a0abcf7a/202610/microi-ai-development-framework-training-syllabus-light.pptx; }
    location = /downloads/microi-ai-development-framework-training-syllabus.pdf { return 301 https://file.microi.net/itdos/official-docs/downloads/494b6a08a086c41dcf03cf86ee7390459d17981fbfebe45f4c4bf960b07355e5/202610/microi-ai-development-framework-training-syllabus.pdf; }
    location = /downloads/microi-enterprise-application-training-syllabus-dark.pdf { return 301 https://file.microi.net/itdos/official-docs/downloads/0d2c0da1d95179011c6368cf73fa6d3deb0db9e12854628e6156ac2df3be539a/202610/microi-enterprise-application-training-syllabus-dark.pdf; }
    location = /downloads/microi-enterprise-application-training-syllabus-dark.pptx { return 301 https://file.microi.net/itdos/official-docs/downloads/0b430c3197055a0974a93f0fa3578ac04042c30af34c748e0285e798270ae437/202610/microi-enterprise-application-training-syllabus-dark.pptx; }
    location = /downloads/microi-enterprise-application-training-syllabus-light.pdf { return 301 https://file.microi.net/itdos/official-docs/downloads/04af7c75efbc2d4faf0a996f61d41327ba214558a815b365fa9296a063c8f949/202610/microi-enterprise-application-training-syllabus-light.pdf; }
    location = /downloads/microi-enterprise-application-training-syllabus-light.pptx { return 301 https://file.microi.net/itdos/official-docs/downloads/eb56237de9996250c3d03cd8416e621f494def2c9f1c286cab5e4c967a9aaed1/202610/microi-enterprise-application-training-syllabus-light.pptx; }

    # 真正的 HTTP 404 配合官网主题错误页，浏览器和爬虫取得相同的可读内容。
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { return 404; }
    # 直接交付首页，避免 nginx 的 index 内部跳转再次触发 index.html 归一化。
    location = / { try_files /index.html =404; }

    # 仅在对应目录首页存在时归一化 index，query 参数保持不变。
    location ~ ^(?<microi_index_dir>/(?:.*/)?)index(?:\.html)?$ {
        if (-f $document_root${microi_index_dir}index.html) {
            return 301 $microi_index_dir$is_args$args;
        }
        return 404;
    }
    location ~ ^(?<microi_page_path>.+)/$ {
        if (-f $document_root$microi_page_path.html) {
            return 301 $microi_page_path.html$is_args$args;
        }
        try_files $uri $uri/index.html =404;
    }
    location ~* \.(html|js|css|json|xml|txt|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|pdf)$ {
        try_files $uri =404;
    }
    location / {
        if (-f $request_filename.html) {
            return 301 $uri.html$is_args$args;
        }
        try_files $uri $uri/ =404;
    }
}

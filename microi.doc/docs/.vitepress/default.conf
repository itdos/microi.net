# 只有带内容指纹的资源长期缓存；HTML、robots 和 sitemap 随发布重新校验。
map $uri $microi_docs_cache_control {
    default "no-cache";
    "~^/assets/.+\.[A-Za-z0-9_-]{8,}\.(js|css|woff2?)$" "public, max-age=31536000, immutable";
}

# ESA 必须保留访客 Host 回源。若固定回源为 microi.net，应先在 ESA 统一域名，
# 或改为跟随请求 Host，再启用该源站规则；否则 www 请求可能循环跳转。
server {
    listen 0.0.0.0:80;
    server_name microi.net doc.microi.net;
    return 301 https://www.microi.net$request_uri;
}

server {
    listen 0.0.0.0:80 default_server;
    server_name www.microi.net localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    # 源站可以通过 HTTP 回源；相对路径跳转不会把外部 HTTPS 降级或暴露内部端口。
    absolute_redirect off;
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    add_header Cache-Control $microi_docs_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Access-Control-Allow-Origin '*';

    # 真正的 HTTP 404 配合官网主题错误页，浏览器和爬虫取得相同的可读内容。
    error_page 404 /404.html;
    location = /404.html { internal; }
    location ~ /\. { return 404; }
    # 直接交付首页，避免 nginx 的 index 内部跳转再次触发 index.html 归一化。
    location = / { try_files /index.html =404; }

    # 仅在对应目录首页存在时归一化 index，query 参数保持不变。
    location ~ ^(?<microi_index_dir>/(?:.*/)?)index(?:\.html)?$ {
        if (-f $document_root${microi_index_dir}index.html) {
            return 301 $microi_index_dir$is_args$args;
        }
        return 404;
    }
    location ~ ^(?<microi_page_path>.+)/$ {
        if (-f $document_root$microi_page_path.html) {
            return 301 $microi_page_path.html$is_args$args;
        }
        try_files $uri $uri/index.html =404;
    }
    location ~* \.(html|js|css|json|xml|txt|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|pdf)$ {
        try_files $uri =404;
    }
    location / {
        if (-f $request_filename.html) {
            return 301 $uri.html$is_args$args;
        }
        try_files $uri $uri/ =404;
    }
}

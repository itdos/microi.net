<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- iOS 添加到主屏幕 / Web App 模式 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" id="appleMobileTitle" content="Loading...">
    <link rel="apple-touch-icon" id="appleTouchIcon" href="/favicon.png">
    <title>Loading...</title>
    <script type="text/javascript">
        var OsClient = '';
        var ApiBase = '';
        var FileServer = '';
        var OsClientType = '';
        var ApiCustom = '';
    </script>
    <style>
        /* ========================================================
         * MCI 设计系统 — PC/APK Splash Screen 内联版
         * 与 microi.app/index.html 移动端 Loading 保持一致
         * ======================================================== */

        :root {
            --status-bar-height: 0px;
            --status-bar-height: constant(safe-area-inset-top);
            --status-bar-height: env(safe-area-inset-top);
        }

        /* === 主题变量（亮色多彩默认） === */
        :root[data-theme="light"], :root {
            --mci-color-primary: #6C2BD9;
            --mci-color-primary-light: #8B5CF6;
            --mci-color-primary-glow: rgba(108, 43, 217, 0.2);
            --mci-color-accent-blue: #2196F3;
            --mci-color-accent-cyan: #06B6D4;
            --mci-color-accent-pink: #EC4899;
            --mci-color-danger: #E8294A;

            --mci-bg-base: #F5F5FA;
            --mci-bg-elevated: #FFFFFF;
            --mci-bg-card: rgba(255, 255, 255, 0.92);

            --mci-text-primary: #1A1A2E;
            --mci-text-secondary: rgba(26, 26, 46, 0.65);
            --mci-text-tertiary: rgba(26, 26, 46, 0.45);
            --mci-text-muted: rgba(26, 26, 46, 0.22);

            --mci-border-color: rgba(15, 18, 30, 0.08);

            --mci-gradient-primary: linear-gradient(135deg, #6C2BD9 0%, #2196F3 100%);

            --mci-shadow-button: 0 6px 20px var(--mci-color-primary-glow);
            --mci-glow-primary: 0 0 24px var(--mci-color-primary-glow),
                                0 0 60px rgba(33, 150, 243, 0.18);

            --mci-radius-md: 12px;
            --mci-radius-xl: 20px;
            --mci-radius-2xl: 24px;
            --mci-radius-full: 9999px;

            --mci-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }

        /* === 暗黑主题（可选） === */
        :root[data-theme="dark"] {
            --mci-color-primary: #722BFF;
            --mci-color-primary-light: #9B5FFF;
            --mci-color-primary-glow: rgba(114, 43, 255, 0.35);
            --mci-color-accent-blue: #29B8FF;
            --mci-color-accent-cyan: #00F5D4;
            --mci-color-accent-pink: #FF6EC7;
            --mci-color-danger: #FF2E63;

            --mci-bg-base: #0A0A0F;
            --mci-bg-elevated: #121218;
            --mci-bg-card: rgba(255, 255, 255, 0.04);

            --mci-text-primary: #FFFFFF;
            --mci-text-secondary: rgba(255, 255, 255, 0.55);
            --mci-text-tertiary: rgba(255, 255, 255, 0.35);
            --mci-text-muted: rgba(255, 255, 255, 0.18);

            --mci-border-color: rgba(255, 255, 255, 0.08);

            --mci-gradient-primary: linear-gradient(135deg, #722BFF 0%, #29B8FF 100%);

            --mci-shadow-button: 0 4px 16px var(--mci-color-primary-glow);
            --mci-glow-primary: 0 0 24px rgba(114, 43, 255, 0.5),
                                0 0 60px rgba(41, 184, 255, 0.18);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: var(--mci-bg-base);
            font-family: var(--mci-font-family);
            color: var(--mci-text-primary);
            font-size: 13px;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* 加载期锁定滚动，避免 Vue mount 后出现滚条造成页面跳动 */
        html.is-loading,
        html.is-loading body {
            overflow: hidden !important;
            height: 100%;
            -webkit-overflow-scrolling: auto;
        }

        /* === Splash 容器（与 microi.loading.js 兼容：保留 #microi_loading 与 fade-out） === */
        #microi_loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
            background: var(--mci-bg-base);
            overflow: hidden;
            transition: opacity 0.5s ease;
            /* iOS 安全区内边距、但不产生外部滚条 */
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            box-sizing: border-box;
            /* 居中子内容 */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #microi_loading.fade-out { opacity: 0; pointer-events: none; }

        /* === 极光光斑 Aurora Orbs === */
        .mci-aurora {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            contain: strict;
        }
        .mci-aurora__orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.55;
            will-change: transform;
            animation: mciAuroraDrift var(--dur, 26s) ease-in-out infinite alternate;
        }
        .mci-aurora__orb--1 {
            width: 520px; height: 520px;
            top: -120px; left: -100px;
            background: radial-gradient(circle, var(--mci-color-primary) 0%, transparent 65%);
            --dur: 22s;
        }
        .mci-aurora__orb--2 {
            width: 460px; height: 460px;
            top: 28%; right: -140px;
            background: radial-gradient(circle, var(--mci-color-accent-blue) 0%, transparent 65%);
            --dur: 28s;
            animation-delay: -8s;
        }
        .mci-aurora__orb--3 {
            width: 580px; height: 580px;
            bottom: -180px; left: 18%;
            background: radial-gradient(circle, var(--mci-color-accent-pink) 0%, transparent 65%);
            opacity: 0.4;
            --dur: 32s;
            animation-delay: -14s;
        }
        .mci-aurora__orb--4 {
            width: 380px; height: 380px;
            top: 55%; left: -80px;
            background: radial-gradient(circle, var(--mci-color-accent-cyan) 0%, transparent 65%);
            opacity: 0.45;
            --dur: 26s;
            animation-delay: -4s;
        }
        @keyframes mciAuroraDrift {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            50%  { transform: translate3d(40px, -30px, 0) scale(1.08); }
            100% { transform: translate3d(-30px, 20px, 0) scale(0.95); }
        }
        :root[data-theme="dark"] .mci-aurora__orb {
            opacity: 0.35;
            filter: blur(80px);
        }

        /* === Splash 主容器 === */
        .mci-splash {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 40px 30px;
        }

        /* === Logo 脉冲圆环（稳定居中：以 .mci-logo-ring 为定位上下文，子结构不再使用负偏移） === */
        .mci-logo-ring {
            position: relative;
            width: 96px;
            height: 96px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .mci-logo-ring::before,
        .mci-logo-ring::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 96px;
            height: 96px;
            margin-left: -48px;
            margin-top: -48px;
            border-radius: 50%;
            pointer-events: none;
        }
        .mci-logo-ring::before {
            border: 2px solid var(--mci-color-primary-glow);
            animation: mciRingPulse 2s ease-out infinite;
        }
        .mci-logo-ring::after {
            border: 1.5px solid var(--mci-color-primary-glow);
            animation: mciRingPulse 2s ease-out infinite 0.6s;
            opacity: 0.5;
        }
        @keyframes mciRingPulse {
            0%   { transform: scale(1);    opacity: 1; }
            100% { transform: scale(1.77); opacity: 0; }
        }
        .mci-logo-core {
            position: relative;
            width: 80px;
            height: 80px;
            background: var(--mci-gradient-primary);
            border-radius: var(--mci-radius-2xl);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--mci-glow-primary);
            animation: mciFloat 3s ease-in-out infinite;
            will-change: transform;
        }
        @keyframes mciFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }
        .mci-logo-core svg {
            width: 40px;
            height: 40px;
            fill: #fff;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.25));
        }
        .mci-logo-core img {
            width: 56px;
            height: 56px;
            object-fit: contain;
            border-radius: 8px;
        }
        .mci-logo-core.has-custom-logo {
            background: transparent;
            box-shadow: none;
        }
        .mci-logo-core.has-custom-logo img {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            filter: drop-shadow(0 6px 20px rgba(0,0,0,0.22)) drop-shadow(0 2px 6px rgba(0,0,0,0.14));
        }

        /* === 文字区 === */
        .mci-app-title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            background: var(--mci-gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 30px var(--mci-color-primary-glow);
        }
        .mci-app-subtitle {
            font-size: 13px;
            color: var(--mci-text-tertiary);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        /* === 加载百分比（不用 transform scale，用 opacity 脉动避免跳动） === */
        .mci-load-percent {
            font-size: 42px;
            font-weight: 700;
            color: var(--mci-text-primary);
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-shadow: 0 2px 20px var(--mci-color-primary-glow);
            animation: mciPercentPulse 1.5s ease-in-out infinite;
            min-height: 52px;
            line-height: 52px;
            font-variant-numeric: tabular-nums;
        }
        @keyframes mciPercentPulse {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.78; }
        }

        /* === 进度条 === */
        .mci-progress-wrap {
            width: 220px;
            height: 4px;
            background: var(--mci-bg-card);
            border-radius: var(--mci-radius-full);
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--mci-border-color);
        }
        .mci-progress-bar {
            height: 100%;
            width: 0%;
            background: var(--mci-gradient-primary);
            border-radius: var(--mci-radius-full);
            transition: width 0.3s ease;
            box-shadow: 0 0 8px var(--mci-color-primary-glow);
        }

        /* === 加载信息 === */
        .mci-load-info {
            font-size: 12px;
            color: var(--mci-text-tertiary);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            min-height: 20px;
            line-height: 20px;
            text-align: center;
        }
        .mci-load-info--speed {
            font-size: 13px;
            color: var(--mci-text-secondary);
        }

        /* === 圆点加载动画 === */
        .mci-load-dots {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 16px 0 12px;
        }
        .mci-load-dots .dot {
            width: 10px;
            height: 10px;
            background: var(--mci-color-primary);
            border-radius: 50%;
            animation: mciDotBounce 1.4s ease-in-out infinite both;
            box-shadow: 0 0 6px var(--mci-color-primary-glow);
        }
        .mci-load-dots .dot:nth-child(1) { animation-delay: -0.32s; }
        .mci-load-dots .dot:nth-child(2) { animation-delay: -0.16s; }
        .mci-load-dots .dot:nth-child(3) { animation-delay: 0s; }
        .mci-load-dots .dot:nth-child(4) { animation-delay: 0.16s; }
        .mci-load-dots .dot:nth-child(5) { animation-delay: 0.32s; }
        @keyframes mciDotBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* === serverUrl（仅 APK 模式显示） === */
        .mci-server-url {
            font-size: 10px;
            color: var(--mci-text-muted);
            word-break: break-all;
            text-align: center;
            max-width: 85vw;
            font-family: 'SF Mono', 'Monaco', 'Menlo', 'Consolas', monospace;
            margin-top: 4px;
            display: none;
        }
        #microi_loading.is-apk .mci-server-url { display: block; }

        /* === 底部水印 === */
        .mci-watermark {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom, 0));
            left: 0;
            right: 0;
            text-align: center;
            font-size: 10px;
            color: var(--mci-text-muted);
            z-index: 2;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <!-- 微信 JSSDK：支持小程序 WebView 内 H5 与小程序通信 -->
    <script>
      // 仅在小程序 WebView 环境下加载 JSSDK
      // 安全修复：避免 document.write，改用动态 <script> 节点插入；同时使用明确版本 URL
      if (window.__wxjs_environment === 'miniprogram' || /source=miniprogram/.test(location.search)) {
        var s = document.createElement('script');
        s.src = 'https://res.wx.qq.com/open/js/jweixin-1.6.0.js';
        s.async = false;
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
    </script>
    <!-- 5+App (Wap2App) 环境：返回键 + 状态栏高度 -->
    <script>
    (function() {
        function initPlusEnv() {
            if (typeof plus === 'undefined') return;

            // 1. 强制设置 webview 的 backButtonAutoControl 为 none
            try {
                var wv = plus.webview.currentWebview();
                wv.setStyle({ backButtonAutoControl: 'none' });
            } catch(e) {}

            // 2. 状态栏高度 → CSS变量 + 默认深色文字（大部分页面白色头部）
            try {
                plus.navigator.setStatusBarStyle('dark');
            } catch(e) {}
            try {
                var h = plus.navigator.getStatusbarHeight();
                if (h > 0) {
                    document.documentElement.style.setProperty('--status-bar-height', h + 'px');
                }
            } catch(e) {}

            // 3. 返回键处理
            var _lastBack = 0;
            function handleBackButton() {
                // Vue 应用 mounted 后会设置 window.__microi_handleBack
                // 由 App.vue 注册，读取 permission.js afterEach 设置的 __microi_isRootPage 标志
                if (typeof window.__microi_handleBack === 'function') {
                    window.__microi_handleBack();
                    return;
                }
                // Vue 尚未 mount 时的降级处理
                if (window.__microi_isRootPage === false) { window.history.back(); return; }
                if (window.__microi_isRootPage === true) {
                    var now2 = Date.now();
                    if (now2 - _lastBack < 2000) { plus.runtime.quit(); return; }
                    _lastBack = now2;
                    plus.nativeUI.toast('再按一次退出应用', { duration: 'short' }); return;
                }
                // 完全未初始化时降级
                try {
                    var pos = window.history.state && window.history.state.position;
                    if (typeof pos === 'number' && pos > 0) { window.history.back(); return; }
                } catch(e) {}
                var now = Date.now();
                if (now - _lastBack < 2000) {
                    plus.runtime.quit();
                } else {
                    _lastBack = now;
                    plus.nativeUI.toast('再按一次退出应用', { duration: 'short' });
                }
            }

            // plus.key —— 5+App/Wap2App 官方返回键 API
            try {
                plus.key.addEventListener('backbutton', handleBackButton, false);
            } catch(e) {}
            // document 监听作为备份
            document.addEventListener('backbutton', function(e) {
                e.preventDefault && e.preventDefault();
                e.stopPropagation && e.stopPropagation();
                handleBackButton();
            }, false);
        }

        if (window.plus) {
            initPlusEnv();
        } else {
            document.addEventListener('plusready', initPlusEnv, false);
        }
    })();
    </script>
</head>
<body class="microi Classic">
    <div id="microi_loading">
        <!-- 极光光斑背景 -->
        <div class="mci-aurora" aria-hidden="true">
            <span class="mci-aurora__orb mci-aurora__orb--1"></span>
            <span class="mci-aurora__orb mci-aurora__orb--2"></span>
            <span class="mci-aurora__orb mci-aurora__orb--3"></span>
            <span class="mci-aurora__orb mci-aurora__orb--4"></span>
        </div>

        <div class="mci-splash">
            <!-- Logo 脉冲圆环 -->
            <div class="mci-logo-ring">
                <div class="mci-logo-core" id="logoCore">
                    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
            </div>

            <!-- 标题 -->
            <div class="mci-app-title" id="appTitle">Loading...</div>
            <div class="mci-app-subtitle">正在加载资源</div>

            <!-- 加载百分比 -->
            <div class="mci-load-percent" id="loadPercent">0%</div>

            <!-- 进度条 -->
            <div class="mci-progress-wrap"><div class="mci-progress-bar" id="progressBar"></div></div>

            <!-- 圆点动画 -->
            <div class="mci-load-dots" id="loadDots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>

            <!-- 服务器地址（APK 模式下显示） -->
            <div class="mci-server-url" id="serverUrl"></div>
        </div>

        <div class="mci-watermark" id="watermark">Powered by Loading...</div>
    </div>
    <script>
      (function() {
        try {
          // 加载期锁定滚动（避免 Vue mount 后滚条闪现造成页面跳动）
          document.documentElement.classList.add('is-loading');
        } catch(e) {}
        try {
          // 主题初始化（默认亮色多彩、跟随系统、支持 localStorage 持久化）
          var saved = localStorage.getItem('mci-theme');
          var prefersDark = window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.setAttribute('data-theme',
              saved || (prefersDark ? 'dark' : 'light'));
        } catch(e) {}
        try {
          // 读取 SysConfig 缓存，更新标题和公司名
          var data = JSON.parse(localStorage.getItem('microi.net') || '{}');
          var cfg = data.SysConfig;
          if (cfg) {
            if (cfg.SysTitle) {
              document.title = cfg.SysTitle;
              var t = document.getElementById('appTitle');
              if (t) t.textContent = cfg.SysTitle;
              // 同步更新 iOS WebApp 主屏幕标题
              var amwat = document.getElementById('appleMobileTitle');
              if (amwat) amwat.setAttribute('content', cfg.SysTitle);
            }
            if (cfg.CompanyName) {
              var w = document.getElementById('watermark');
              if (w) w.textContent = 'Powered by ' + cfg.CompanyName;
            }
            if (cfg.SysLogo) {
              var fileServer = (cfg.FileServer || '').replace(/\/+$/, '');
              var sysLogo = cfg.SysLogo;
              var logoUrl = '';
              try {
                // toUrl: 路径已是绝对 URL 则直接返回，否则拼接 fileServer
                var toUrl = function(p) { return (p && p.indexOf('http') === 0) ? p : (fileServer + (p || '')); };
                if (typeof sysLogo === 'object' && sysLogo !== null) {
                  logoUrl = toUrl(sysLogo.Path || sysLogo.path || '');
                } else {
                  var s = String(sysLogo);
                  if (s.indexOf('http') === 0) {
                    logoUrl = s;
                  } else if (s.charAt(0) === '{') {
                    var obj = JSON.parse(s); logoUrl = toUrl(obj.Path || obj.path || '');
                  } else if (s.charAt(0) === '[') {
                    var arr = JSON.parse(s); logoUrl = arr.length > 0 ? toUrl(arr[0].Path || arr[0].path || '') : '';
                  } else {
                    logoUrl = fileServer + s;
                  }
                }
              } catch (e) { logoUrl = ''; }
              if (logoUrl) {
                // 替换 Loading 界面中心 Logo
                var lc = document.getElementById('logoCore');
                if (lc) {
                  lc.innerHTML = '<img src="' + logoUrl + '" alt="Logo">';
                  lc.classList.add('has-custom-logo');
                }
                // 更新 iOS 添加到主屏幕的图标
                var ati = document.getElementById('appleTouchIcon');
                if (ati) ati.setAttribute('href', logoUrl);
              }
            }
          }
        } catch(e) {}
        try {
          // 5+App (APK)：标记起始进度为20%（与 hbuilder-app 加载页衔接），并显示当前服务器地址
          if (window.plus || navigator.userAgent.indexOf('Html5Plus') > -1) {
            window.__microi_apk_start = 20;
            var pe = document.getElementById('loadPercent');
            var pb = document.getElementById('progressBar');
            if (pe) pe.textContent = '20%';
            if (pb) pb.style.width = '20%';
            // 标记 APK 模式，激活 mci-server-url 显示
            var loadEl = document.getElementById('microi_loading');
            if (loadEl) loadEl.classList.add('is-apk');
            // 显示当前访问地址
            var urlEl = document.getElementById('serverUrl');
            if (urlEl) urlEl.textContent = window.location.href;
          }
          // 小程序 webview 模式下隐藏 loading
          var href = location.href || '';

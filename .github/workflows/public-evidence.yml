name: 公开证据工具离线回归
on:
  push:
    branches: [master]
    paths:
      - 'microi.benchmarks/**'
      - 'microi.mcp/**'
      - '.github/workflows/public-evidence.yml'
      - 'microi.doc/scripts/indexnow.mjs'
      - 'microi.doc/tests/indexnow.test.mjs'
      - 'microi.doc/docs/.vitepress/config/seo-policy.mjs'
  workflow_dispatch:
  pull_request:
    paths:
      - 'microi.mcp/**'
      - 'microi.benchmarks/manifest-delivery/**'
      - 'microi.benchmarks/ecosystem/**'
      - 'microi.benchmarks/compatibility/**'
      - 'microi.benchmarks/case-evidence/**'
      - 'microi.benchmarks/ai-quality/**'
      - '.github/workflows/public-evidence.yml'
      - 'microi.doc/scripts/indexnow.mjs'
      - 'microi.doc/tests/indexnow.test.mjs'
      - 'microi.doc/docs/.vitepress/config/seo-policy.mjs'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: '20'
          package-manager-cache: false
      - name: 合成数据与源码盘点测试（不连接数据库或模型）
        run: node --max-old-space-size=256 --test --test-concurrency=1 microi.benchmarks/ecosystem/collect.test.mjs microi.benchmarks/compatibility/inspect.test.mjs microi.benchmarks/case-evidence/summarize-saas-registry.test.mjs microi.benchmarks/ai-quality/run.test.mjs microi.benchmarks/manifest-delivery/verify.test.mjs microi.doc/tests/indexnow.test.mjs
  manifest:
    name: MCP 合约 ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: 按锁文件安装公开 MCP 的测试依赖
        working-directory: microi.mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: MCP TypeScript 检查
        working-directory: microi.mcp
        run: npm run typecheck
      - name: 正式处理器与声明交付合约（无业务或模型连接）
        env:
          CONTRACT_REPORT_PATH: ${{ runner.temp }}/microi-manifest-evidence/manifest-contract.json
        # 输出仅含计数、环境与摘要；独立临时目录避免把工作区和原始日志上传。
        run: >-
          node -e "const fs=require('node:fs'); const path=require('node:path'); const {spawnSync}=require('node:child_process'); const report=process.env.CONTRACT_REPORT_PATH; fs.mkdirSync(path.dirname(report),{recursive:true}); const result=spawnSync(process.execPath,['microi.benchmarks/manifest-delivery/verify.mjs','--out',report],{stdio:'inherit'}); process.exit(result.status ?? 1);"
      - name: 依赖升级后的输入边界与真实 MCP 发现
        working-directory: microi.mcp
        run: node --import tsx --test --test-reporter=tap src/dependency-security.test.ts
      - name: 保存各平台合约结果（失败也保留）
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node 24
        with:
          name: manifest-contract-${{ matrix.os }}-node${{ matrix.node }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/microi-manifest-evidence/manifest-contract.json
          # 检查尚未开始时不伪造结果；已有失败 JSON 则照常保存，原失败状态不改变。
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 90
  full-mcp:
    name: MCP 完整离线回归 / Ubuntu / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 确认真实 TLS 回归的 OpenSSL 前置
        run: openssl version
      - name: 按锁文件安装公开 MCP 的测试依赖
        working-directory: microi.mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: MCP TypeScript 检查
        working-directory: microi.mcp
        run: npm run typecheck
      - name: 自动发现并串行执行全部 MCP 测试（含本机 HTTP 和 TLS 夹具）
        env:
          FULL_REPORT_PATH: ${{ runner.temp }}/microi-full-evidence/full-mcp.json
        # 仅上传输入清单、哈希、环境与计数；运行器不输出原始测试、业务或模型日志。
        run: >-
          node -e "const fs=require('node:fs'); const path=require('node:path'); const {spawnSync}=require('node:child_process'); const report=process.env.FULL_REPORT_PATH; fs.mkdirSync(path.dirname(report),{recursive:true}); const result=spawnSync(process.execPath,['microi.benchmarks/manifest-delivery/verify.mjs','--suite','full','--out',report],{stdio:'inherit'}); process.exit(result.status ?? 1);"
      - name: 保存完整回归的脱敏结果（失败也保留）
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node 24
        with:
          name: full-mcp-ubuntu-node24-${{ github.run_attempt }}
          path: ${{ runner.temp }}/microi-full-evidence/full-mcp.json
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 90
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 按锁文件安装公开 MCP 依赖
        working-directory: microi.mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 生产依赖公告检查（不忽略中高危）
        working-directory: microi.mcp
        run: npm audit --omit=dev --audit-level=moderate

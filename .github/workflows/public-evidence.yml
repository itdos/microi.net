name: 公开证据工具离线回归
on:
  push:
    branches: [master]
    paths:
      - 'microi.benchmarks/**'
      - 'microi.mcp/**'
      - '.github/workflows/public-evidence.yml'
      - 'microi.doc/scripts/indexnow.mjs'
      - 'microi.doc/tests/indexnow.test.mjs'
      - 'microi.doc/docs/.vitepress/config/seo-policy.mjs'
  workflow_dispatch:
  pull_request:
    paths:
      - 'microi.mcp/**'
      - 'microi.benchmarks/manifest-delivery/**'
      - 'microi.benchmarks/ecosystem/**'
      - 'microi.benchmarks/compatibility/**'
      - 'microi.benchmarks/case-evidence/**'
      - 'microi.benchmarks/ai-quality/**'
      - '.github/workflows/public-evidence.yml'
      - 'microi.doc/scripts/indexnow.mjs'
      - 'microi.doc/tests/indexnow.test.mjs'
      - 'microi.doc/docs/.vitepress/config/seo-policy.mjs'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: 合成数据与源码盘点测试（不连接数据库或模型）
        run: node --max-old-space-size=256 --test --test-concurrency=1 microi.benchmarks/ecosystem/collect.test.mjs microi.benchmarks/compatibility/inspect.test.mjs microi.benchmarks/case-evidence/summarize-saas-registry.test.mjs microi.benchmarks/ai-quality/run.test.mjs microi.benchmarks/manifest-delivery/verify.test.mjs microi.doc/tests/indexnow.test.mjs
  manifest:
    name: MCP 合约 ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: 按锁文件安装公开 MCP 的测试依赖
        working-directory: microi.mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: MCP TypeScript 检查
        working-directory: microi.mcp
        run: npm run typecheck
      - name: 正式处理器与声明交付合约（无业务或模型连接）
        run: node microi.benchmarks/manifest-delivery/verify.mjs
      - name: 依赖升级后的输入边界与真实 MCP 发现
        working-directory: microi.mcp
        run: node --import tsx --test --test-reporter=tap src/dependency-security.test.ts
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 按锁文件安装公开 MCP 依赖
        working-directory: microi.mcp
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 生产依赖公告检查（不忽略中高危）
        working-directory: microi.mcp
        run: npm audit --omit=dev --audit-level=moderate

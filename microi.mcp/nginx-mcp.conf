# Microi MCP Server Nginx 反向代理配置
# 将此配置添加到 api.microi.net 的 Nginx server{} 块中
# 这样 MCP 就通过 https://api.microi.net/mcp/ 访问，无需单独域名
#
# 用法：在宿主机 Nginx 中 include 此文件，或将内容复制到已有的 server{} 中
# 前提：microi-mcp 容器已启动，端口映射为 127.0.0.1:3000

# MCP SSE 端点（AI 工具连接此地址）
# 透传认证头 X-Microi-Username / X-Microi-Password / X-Microi-OsClient
location /mcp/sse {
    proxy_pass http://127.0.0.1:3000/sse;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Microi-Username $http_x_microi_username;
    proxy_set_header X-Microi-Password $http_x_microi_password;
    proxy_set_header X-Microi-OsClient $http_x_microi_osclient;

    # SSE 必需：禁用缓冲，保持长连接
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    chunked_transfer_encoding on;
}

# MCP 消息端点
location /mcp/messages {
    proxy_pass http://127.0.0.1:3000/messages;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# MCP 健康检查
location /mcp/health {
    proxy_pass http://127.0.0.1:3000/health;
    proxy_set_header Host $host;
}
